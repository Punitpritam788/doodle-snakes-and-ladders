# Save as .github/workflows/leaderboard.yml in your repo.
# The game's "Post my last win to GitHub" button opens a pre-filled issue
# (label "score"). This workflow reads it, updates leaderboard.json and
# LEADERBOARD.md, replies, and closes the issue.
name: Leaderboard

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  add-score:
    if: contains(github.event.issue.labels.*.name, 'score')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add score
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issue = context.payload.issue;
            const reply = async (text, close) => {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: text });
              if (close) await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed' });
            };
            const m = (issue.body || '').match(/```json\s*([\s\S]*?)```/);
            let s;
            try { s = JSON.parse(m && m[1]); } catch (e) { return reply('Could not read the score JSON.', true); }
            const name = String(s.name || '').replace(/[^A-Za-z0-9 _-]/g, '').trim().slice(0, 14);
            const turns = Number.parseInt(s.turns, 10);
            const players = Math.min(4, Math.max(1, Number.parseInt(s.players, 10) || 1));
            const rnd = s.rnd === true;
            if (!name || !(turns >= 1 && turns <= 500)) return reply('That score does not look valid.', true);

            let board = [];
            try { board = JSON.parse(fs.readFileSync('leaderboard.json', 'utf8')); } catch (e) {}
            const key = (e) => e.name.toLowerCase() + '|' + (e.rnd ? 'r' : 'c');
            const mine = { name, turns, rnd, players, date: new Date().toISOString().slice(0, 10) };
            const old = board.find((e) => key(e) === key(mine));
            if (!old) board.push(mine);
            else if (turns < old.turns) Object.assign(old, mine);
            board.sort((a, b) => a.turns - b.turns || a.date.localeCompare(b.date));
            board = board.slice(0, 200);
            fs.writeFileSync('leaderboard.json', JSON.stringify(board, null, 2) + '\n');

            const table = (list) => ['| # | Name | Turns | Players | Date |', '|---|------|-------|---------|------|']
              .concat(list.slice(0, 25).map((e, i) => `| ${i + 1} | ${e.name} | ${e.turns} | ${e.players} | ${e.date} |`)).join('\n');
            fs.writeFileSync('LEADERBOARD.md',
              '# Doodle Snakes & Ladders - Leaderboard\n\n## Classic board\n\n' + table(board.filter((e) => !e.rnd)) +
              '\n\n## Random snakes & ladders\n\n' + table(board.filter((e) => e.rnd)) + '\n');
            await reply(`Added **${name}** with ${turns} turns. Thanks for playing!`, true);

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leaderboard.json LEADERBOARD.md
          git diff --cached --quiet || (git commit -m "Update leaderboard" && git push)
